name: BLS Randevu Kontrolü

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python'u hazırla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Botu çalıştır
        run: python bls_check.py